name: Build Korean Qt translation files
on:
  push:
    paths:
      - 'SRC_v3.41.01-beta/Waifu2x-Extension-QT/language_Korean.ts'
      - '.github/workflows/build-korean-qm.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Qt Linguist tools
        run: sudo apt-get update && sudo apt-get install -y qttools5-dev-tools
      - name: Compile QM files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/ko/qm-preview
          lrelease SRC_v3.41.01-beta/Waifu2x-Extension-QT/language_Korean.ts -qm docs/ko/qm-preview/language_Korean.qm
          cp docs/ko/qm-preview/language_Korean.qm docs/ko/qm-preview/language_English.qm
          file docs/ko/qm-preview/*.qm
      - name: Upload files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Korean-QM-preview
          path: docs/ko/qm-preview/*.qm
          if-no-files-found: error
      - name: Publish compiled QM in repository
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ko/qm-preview/*.qm
          if ! git diff --cached --quiet; then
            git commit -m "i18n(ko): compile Korean Qt QM preview"
            git push
          fi
