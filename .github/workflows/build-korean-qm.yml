name: Build Korean Qt translation (QM)
on:
  push:
    paths:
      - 'SRC_v3.41.01-beta/Waifu2x-Extension-QT/language_Korean.ts'
      - '.github/workflows/build-korean-qm.yml'
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt Linguist tools
        run: sudo apt-get update && sudo apt-get install -y qttools5-dev-tools
      - name: Compile Korean QM
        run: |
          lrelease SRC_v3.41.01-beta/Waifu2x-Extension-QT/language_Korean.ts -qm language_Korean.qm
          file language_Korean.qm
      - name: Upload Korean QM
        uses: actions/upload-artifact@v4
        with:
          name: language_Korean-qm
          path: language_Korean.qm
